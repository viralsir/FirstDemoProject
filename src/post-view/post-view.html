<input type="button" value="Load Post List" class="btn btn-primary" (click)="loaddata()">
<table class="table">
  <tr>
    <th colspan="4"> Post List</th>
  </tr>
  <tr>
    <th> User Id </th>
    <th> Id</th>
    <th> Title</th>
    <th> Body</th>
  </tr>
  @for (Post of this.postlist; track Post.id) {
    <tr>
      <td>{{Post.userId}}</td>
      <td> {{Post.id}}</td>
      <td>{{Post.title}}</td>
      <td>{{Post.body}}</td>
    </tr>
  } @empty {
     <tr>
       <td colspan="4"> No Record Found </td>
     </tr>
  }
</table>
