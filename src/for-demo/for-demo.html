<h1> student name is {{sname}}</h1>
<table>
  <tr>
    <th>Id</th> <th> Name</th> <th> Salary</th> <th> Department</th>
  </tr>
  @for (employee of this.employeelist; track employee.id)
  {
    <tr>
      <td>{{employee.id}}</td>
      <td> {{employee.name}}</td>
      <td>{{employee.salary}}</td>
      <td> {{employee.department}}</td>
    </tr>
  }

</table>
