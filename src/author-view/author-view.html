<table>
  <tr> <th> Author List </th></tr>
  <tr>
    <th> ID </th>
    <th> Name </th>
    <th> Email</th>
  </tr>
  @for (author of authorlist();track author.id)
  {
     <tr>
       <td>{{author.id}}</td>
       <td>{{author.name}}</td>
       <td>{{author.email}}</td>
     </tr>
  } @empty {
    <tr>
      <td> No Records Found</td>
    </tr>
  }
</table>
